name: Optimize site cover images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate lightweight WebP covers
        run: |
          set -e
          mkdir -p assets/thumbs

          convert "assets/mahestan/20211110_210510.jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/mahestan-cover.webp"

          convert "assets/vindarik/file_00000000da0881f493745628b5fdbfbb.png"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/evin-darakeh-cover.webp"

          convert "assets/kashan/file_000000002e0481f49c7cb192034cbcf2.png"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/kashan-cover.webp"

          convert "assets/khusf/1o.jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/khusf-cover.webp"

          convert -define jpeg:size=1800x1800 "assets/khusf/khusf jenabian.jpg"             -auto-orient -resize "1800x1800>" -strip -quality 80             "assets/thumbs/khusf-jenabian.webp"

          convert -define jpeg:size=1800x1800 "assets/khusf/khousf (1).jpg"             -auto-orient -resize "1800x1800>" -strip -quality 80             "assets/thumbs/khusf-extra-1.webp"

          convert "Flush plaza with burgundy inlays.png"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/arak-cover.webp"

          convert "sanglaj_sample.jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/sanglaj-cover.webp"

          convert "osmaniye-site-cover.jpg"             -auto-orient -resize "1920x1920>" -strip -quality 80             "assets/thumbs/osmaniye-cover.webp"

          convert "assets/oudlajan/oudl.jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/oudlajan-cover.webp"

          convert "assets/sepahan-shahr-innovation/s (2).jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/sepahan-shahr-cover.webp"

          convert "assets/khalkhal-historic/خلخال low.jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/khalkhal-cover.webp"

          convert "assets/sayyad-office-complex/file_0000000035f881f4987a3ec728e7a201.png"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/sayyad-office-cover.webp"

          convert "assets/komesh-park-semnan/پوستر طرح پارک کومش سمنان.jpg"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/komesh-park-cover.webp"

          # Saadatabad cover refresh
          convert "assets/saadatabad-residential-building/file_0000000003448211ab02ae2a5c69cb86.png"             -auto-orient -resize "1600x1600>" -strip -quality 78             "assets/thumbs/saadatabad-residential-cover.webp"

          ls -lh assets/thumbs

      - name: Commit optimized covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/thumbs
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize portfolio cover images"
            git push
          fi
